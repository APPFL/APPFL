<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Three sites on AWS run ADKO agents and exchange tokens with each other over gRPC; each sends its training runs to its own Globus Compute endpoint on a GPU machine and gets back an accuracy.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6B70"/>
    </marker>
    <marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6E7E"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; }
    .mono { font-family: Menlo, Consolas, monospace; }
  </style>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#FFFFFF"/>

  <!-- Sites -->
  <rect x="20" y="20" width="920" height="200" rx="10" fill="#EDF4F5"/>
  <text x="40" y="46" font-size="15" font-weight="bold" fill="#0F6E7E">Sites (here: three AWS EC2 instances, CPU only) · run_site.py · gRPC on :50051</text>

  <path d="M170 110 C 170 62, 790 62, 790 110" fill="none" stroke="#0F6E7E" stroke-width="2" marker-start="url(#ahT)" marker-end="url(#ahT)"/>
  <text x="480" y="98" font-size="12" font-style="italic" fill="#0F6E7E" text-anchor="middle">tokens</text>

  <rect x="60" y="110" width="220" height="90" rx="8" fill="#2E9CA8"/>
  <text x="170" y="142" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent-0</text>
  <text x="170" y="163" font-size="12" fill="#FFFFFF" text-anchor="middle">ADKO agent · private GP</text>
  <text x="170" y="184" font-size="12" fill="#FFFFFF" text-anchor="middle" class="mono">node_0.yaml</text>

  <rect x="370" y="110" width="220" height="90" rx="8" fill="#2E9CA8"/>
  <text x="480" y="142" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent-1</text>
  <text x="480" y="163" font-size="12" fill="#FFFFFF" text-anchor="middle">ADKO agent · private GP</text>
  <text x="480" y="184" font-size="12" fill="#FFFFFF" text-anchor="middle" class="mono">node_1.yaml</text>

  <rect x="680" y="110" width="220" height="90" rx="8" fill="#2E9CA8"/>
  <text x="790" y="142" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent-2</text>
  <text x="790" y="163" font-size="12" fill="#FFFFFF" text-anchor="middle">ADKO agent · private GP</text>
  <text x="790" y="184" font-size="12" fill="#FFFFFF" text-anchor="middle" class="mono">node_2.yaml</text>

  <line x1="284" y1="155" x2="366" y2="155" stroke="#0F6E7E" stroke-width="2" marker-start="url(#ahT)" marker-end="url(#ahT)"/>
  <text x="325" y="146" font-size="12" font-style="italic" fill="#0F6E7E" text-anchor="middle">tokens</text>
  <line x1="594" y1="155" x2="676" y2="155" stroke="#0F6E7E" stroke-width="2" marker-start="url(#ahT)" marker-end="url(#ahT)"/>
  <text x="635" y="146" font-size="12" font-style="italic" fill="#0F6E7E" text-anchor="middle">tokens</text>

  <!-- Remote evaluations -->
  <line x1="145" y1="200" x2="145" y2="406" stroke="#5A6B70" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="406" x2="195" y2="200" stroke="#5A6B70" stroke-width="2" marker-end="url(#ah)"/>
  <text x="135" y="285" font-size="12" font-style="italic" fill="#5A6B70" text-anchor="end">design point θ</text>
  <text x="205" y="285" font-size="12" font-style="italic" fill="#5A6B70">accuracy y</text>

  <line x1="455" y1="200" x2="455" y2="406" stroke="#5A6B70" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="505" y1="406" x2="505" y2="200" stroke="#5A6B70" stroke-width="2" marker-end="url(#ah)"/>
  <text x="445" y="285" font-size="12" font-style="italic" fill="#5A6B70" text-anchor="end">design point θ</text>
  <text x="515" y="285" font-size="12" font-style="italic" fill="#5A6B70">accuracy y</text>

  <line x1="765" y1="200" x2="765" y2="406" stroke="#5A6B70" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="815" y1="406" x2="815" y2="200" stroke="#5A6B70" stroke-width="2" marker-end="url(#ah)"/>
  <text x="755" y="285" font-size="12" font-style="italic" fill="#5A6B70" text-anchor="end">design point θ</text>
  <text x="825" y="285" font-size="12" font-style="italic" fill="#5A6B70">accuracy y</text>


  <!-- Endpoints: one per site -->
  <rect x="20" y="320" width="920" height="220" rx="10" fill="#F9EEEB"/>
  <rect x="45" y="350" width="250" height="140" rx="8" fill="#FFFFFF" stroke="#C4553A" stroke-width="1.5"/>
  <text x="59" y="374" font-size="14" font-weight="bold" fill="#C4553A">endpoint-0</text>
  <rect x="75" y="406" width="190" height="66" rx="8" fill="#C4553A"/>
  <text x="170" y="433" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GPU worker</text>
  <text x="170" y="455" font-size="12" fill="#FFFFFF" text-anchor="middle">ResNet on agent-0's shard</text>
  <rect x="355" y="350" width="250" height="140" rx="8" fill="#FFFFFF" stroke="#C4553A" stroke-width="1.5"/>
  <text x="369" y="374" font-size="14" font-weight="bold" fill="#C4553A">endpoint-1</text>
  <rect x="385" y="406" width="190" height="66" rx="8" fill="#C4553A"/>
  <text x="480" y="433" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GPU worker</text>
  <text x="480" y="455" font-size="12" fill="#FFFFFF" text-anchor="middle">ResNet on agent-1's shard</text>
  <rect x="665" y="350" width="250" height="140" rx="8" fill="#FFFFFF" stroke="#C4553A" stroke-width="1.5"/>
  <text x="679" y="374" font-size="14" font-weight="bold" fill="#C4553A">endpoint-2</text>
  <rect x="695" y="406" width="190" height="66" rx="8" fill="#C4553A"/>
  <text x="790" y="433" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GPU worker</text>
  <text x="790" y="455" font-size="12" fill="#FFFFFF" text-anchor="middle">ResNet on agent-2's shard</text>
  <text x="40" y="518" font-size="15" font-weight="bold" fill="#C4553A">GPU machines · one Globus Compute endpoint per site · its data never leaves it</text>
</svg>
