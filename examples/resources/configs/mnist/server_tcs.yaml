client_configs:
  train_configs:
    trainer: TCSTrainer
    mode: step
    num_base_steps: 10
    num_local_steps: 100
    kappa: 0.5
    optim: SGD
    optim_args:
      lr: 0.1
    loss_fn: CrossEntropyLoss
    train_batch_size: 10
    train_data_shuffle: true
  model_configs:
    model_path: ./resources/model/cnn.py
    model_name: CNN
    model_kwargs:
      num_channel: 1
      num_classes: 10
      num_pixel: 28
server_configs:
  num_clients: 2
  num_global_epochs: 10
  scheduler: SyncScheduler
  scheduler_kwargs:
    same_init_model: true
  aggregator: TCSAggregator
  aggregator_kwargs: {}
  logging_output_dirname: ./output
  comm_configs:
    grpc_configs:
      server_uri: localhost:50051
      max_message_size: 1048576
      use_ssl: false
