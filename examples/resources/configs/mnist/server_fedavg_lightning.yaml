client_configs:
  train_configs:
    # Local trainer: runs `pl.Trainer.fit` on the LightningModule each round.
    # The optimizer and the training loss come from the module itself
    # (`configure_optimizers` and `training_step`), not from this file.
    trainer: "LightningTrainer"
    mode: "epoch"
    num_local_epochs: 1
    # Client validation: runs the module's `validation_step` after local training,
    # and on the received global model before local training (`pre_*` metrics)
    do_validation: True
    do_pre_validation: True
    # Data loader
    train_batch_size: 64
    val_batch_size: 64
    train_data_shuffle: True
    # Loss and metric, only used for the optional server-side validation
    loss_fn_path: "./resources/loss/celoss.py"
    loss_fn_name: "CELoss"
    metric_path: "./resources/metric/acc.py"
    metric_name: "accuracy"

  model_configs:
    model_path: "./resources/model/lightning_cnn.py"
    model_name: "LightningCNN"
    model_kwargs:
      num_channel: 1
      num_classes: 10
      num_pixel: 28
      lr: 0.001

  comm_configs:
    compressor_configs:
      enable_compression: False

server_configs:
  num_clients: 2
  scheduler: "SyncScheduler"
  scheduler_kwargs:
    same_init_model: True
  aggregator: "FedAvgAggregator"
  aggregator_kwargs:
    client_weights_mode: "equal"
  device: "cpu"
  num_global_epochs: 10
  logging_output_dirname: "./output"
  logging_output_filename: "result"
  comm_configs:
    grpc_configs:
      server_uri: localhost:50051
      max_message_size: 1048576
      use_ssl: False
