# APPFL FedAvg server config for the Evo2 wastewater-PEFT case study.
# No model_configs block: there is no server-side model (evo2_aggregator.py
# handles self.model = None).

client_configs:
  train_configs:
    trainer_path: ./resources/configs/evo2_wastewater_peft/evo2_trainer.py
    trainer: Evo2PEFTTrainer
    # Per-site values (site, base_data, model_path, evo2_dir, aidrin_csv)
    # live in each client's own yaml instead.
    num_local_steps: 100
    lr: 0.0002
    drisee_threshold: 20.0

  comm_configs:
    compressor_configs:
      enable_compression: False

server_configs:
  num_clients: 2
  scheduler: SyncScheduler

  aggregator_path: ./resources/configs/evo2_wastewater_peft/evo2_aggregator.py
  aggregator: Evo2FedAvgAggregator
  aggregator_kwargs:
    client_weights_mode: equal

  device: cpu
  num_global_epochs: 20
  logging_output_dirname: ./output
  logging_output_filename: evo2_fedavg
  comm_configs:
    grpc_configs:
      server_uri: "0.0.0.0:50051"
      max_message_size: 104857600
      use_ssl: False
      optimize_memory: True
      # Polling mode (github.com/APPFL/APPFL/pull/463) — not in a tagged
      # release yet, needs appfl from git main. No client-side config needed.
      use_polling: True
      poll_interval: 5.0
      max_workers: 128
