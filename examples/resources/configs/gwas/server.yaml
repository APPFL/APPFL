client_configs:
  train_configs:
    trainer_path: examples/resources/configs/gwas/site_gwas_trainer.py
    trainer: SiteGWASTrainer
    gwas_chunk_size: 512
    qq_max_points: 250000
  comm_configs:
    compressor_configs:
      enable_compression: false

server_configs:
  num_clients: 3
  scheduler: SyncScheduler
  scheduler_kwargs:
    same_init_model: true
  aggregator_path: examples/resources/configs/gwas/meta_analysis_aggregator.py
  aggregator: MetaAnalysisAggregator
  aggregator_kwargs:
    output_dir: local/server_output
    qq_max_points: 250000
  num_global_epochs: 1
  logging_output_dirname: local/server_output/logs
  logging_output_filename: appfl_meta_server
  comm_configs:
    grpc_configs:
      server_uri: 127.0.0.1:50051
      max_message_size: 1073741824
      use_ssl: false
      use_model_chunking: false
      optimize_memory: true
