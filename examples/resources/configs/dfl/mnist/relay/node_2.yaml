# One DFL node in a mixed federation -- site 2, publishing through the relay.
#
# Sites 0 and 1 can be dialled, so they serve directly. Sites 2 and 3 cannot -- think NAT, or
# a firewall that only permits outbound connections -- so they publish to a relay and their
# peers collect from there. Both kinds take part in the same federation, and no launcher
# knows which kind it is running: the difference is entirely in this file.
#
#   python dfl/grpc/run_relay.py --config ./resources/configs/dfl/mnist/relay/relay.yaml
#   python dfl/grpc/run_node.py --config ./resources/configs/dfl/mnist/relay/node_2.yaml

node_id: "Node2"

num_epochs: 20 # rounds of {local training -> exchange with neighbors -> aggregate}
aggregator: "DFLNodeFedAvgAggregator"
aggregator_kwargs: {}

# Who this node exchanges models with -- the only thing about the graph it needs to know.
neighbors:
  mode: "explicit"
  # Who may request MY model. A peer not on this list is refused -- by this
  # node's own servicer in peer-to-peer mode, or by the relay, which builds its
  # permission map out of what each node declares when it checks in.
  send_to: ["Node0", "Node1", "Node3"]
  # Whose models I fetch and average. `server_uri` is simply where to reach them: their own
  # address if they serve, or the relay they publish through if they do not. The fetching
  # side sends the same request either way, which is why mixing the two needs no new code.
  recv_from:
    - node_id: "Node0"
      server_uri: "localhost:50051"
    - node_id: "Node1"
      server_uri: "localhost:50052"
    - node_id: "Node3"
      server_uri: "localhost:50050"
comm_configs:
  grpc_configs:
    # No server_uri: this site is never dialled. It publishes to the relay instead, and its
    # peers collect from there -- which is why their recv_from entry for it is the relay.
    relay_server_uri: "localhost:50050"
    max_message_size: 1048576
    use_ssl: False

train_configs:
  # Local trainer
  trainer: "VanillaTrainer"
  mode: "step"
  num_local_steps: 100
  optim: "Adam"
  optim_args:
    lr: 0.001
  # Loss function
  loss_fn_path: "./resources/loss/celoss.py"
  loss_fn_name: "CELoss"
  # Local validation
  do_validation: True
  do_pre_validation: True
  metric_path: "./resources/metric/acc.py"
  metric_name: "accuracy"
  # Differential privacy
  use_dp: False
  # Data loader
  train_batch_size: 64
  val_batch_size: 64
  train_data_shuffle: True
  val_data_shuffle: False
  # Device
  device: "cpu"
  # Logging and outputs
  logging_output_dirname: "./output"
  logging_output_filename: "result"

model_configs:
  # Every node builds its own model, so they must agree on the seed
  # or load the same weights from a file. The model is not sent over the network.
  seed: 42
  model_path: "./resources/model/cnn.py"
  model_name: "CNN"
  model_kwargs:
    num_channel: 1
    num_classes: 10
    num_pixel: 28

data_configs:
  dataset_path: "./resources/dataset/mnist_dataset.py"
  dataset_name: "get_mnist"
  dataset_kwargs:
    num_clients: 4
    client_id: 2
    partition_strategy: "class_noniid"
    visualization: False
    output_dirname: "./output"
    output_filename: "visualization.pdf"
