# Toy 1-D ADKO experiment -- site 0 of a mixed federation.
# Sites 0 and 1 can be dialled, so they serve their tokens directly. Sites 2 and 3 cannot --
# think NAT, or a firewall that permits only outbound connections -- so they publish to a relay
# and their peers collect from there. Both kinds take part in one federation, and no launcher
# knows which kind it is running: the difference is entirely in this file.
#
#   python decentralized/grpc/run_relay.py
#   python decentralized/grpc/run_site.py --config ./decentralized/resources/configs/toy1d/relay/node_0.yaml

node_id: "agent-0"
seed: 0
node_index: 0                   # this site's position; sets its RNG seed offset
num_epochs: 40                  # rounds of {act -> exchange tokens -> observe}
known_optimum: 100.0            # printed alongside the federation best, when known

neighbors:
  mode: "explicit"
  send_to: ["agent-1", "agent-2", "agent-3"]
  recv_from:
    - node_id: "agent-1"
      server_uri: "localhost:50052"
    - node_id: "agent-2"
      server_uri: "localhost:50050"
    - node_id: "agent-3"
      server_uri: "localhost:50050"

comm_configs:
  budget_configs:
    bits_per_neighbor_per_round: null
    tokens_per_neighbor_per_round: 1
  grpc_configs:
    server_uri: "localhost:50051"
    max_message_size: 1048576
    use_ssl: False

algorithm_configs:
  warmup_rounds: 5              # random proposals before the surrogate is trusted
  token_budget: 40              # tokens an agent keeps in memory
  alpha_tau: 0.01               # fidelity decay rate, exp(-alpha * age)
  objective: "maximize"
  emit_insight: false           # the z field; ignored unless an LLM is attached
  total_proposals: null         # null -> unbounded; set for a fixed evaluation budget
  n_local_candidates: 10
  weights:
    preset: "many_task"
    dim: 1                      # sets the similarity bandwidth for this many dimensions
  baseline:                     # what counts as SUCCESS in the token's s field
    baseline: "running_median"
    baseline_kwargs: {}
  pruner:                       # which token to drop when memory is full
    pruner: "confidence"        # fidelity | confidence | fifo | random
    pruner_kwargs: {}

surrogate_configs:
  surrogate_path: "./decentralized/resources/surrogate/kernel_surrogate.py"
  surrogate_name: "get_surrogate"
  surrogate_kwargs:
    bandwidth: 0.05
    prior_sigma: 1.0

space_configs:
  space_path: "./decentralized/resources/space/toy1d_space.py"
  space_name: "get_design_space"
  space_kwargs:
    agent_index: 0
    num_agents: 4
    seed: 0
    n_bins: 50

evaluator_configs:
  evaluator_path: "./decentralized/resources/evaluator/toy_yield.py"
  evaluator_name: "get_evaluator"
  evaluator_kwargs: {}
