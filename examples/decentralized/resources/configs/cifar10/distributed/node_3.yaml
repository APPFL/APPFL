# CIFAR-10 architecture search with ADKO, non-IID -- site 3 of five, deployed.
#
# The non-IID arm of `../simulation/node_0_noniid.yaml` as five sites, one process each.
# Every site replays the same global split and keeps only its own shard, so `seed`,
# `num_agents` and the evaluator's shard settings must be identical on all five.
#
#   python decentralized/grpc/run_site.py \
#       --config ./decentralized/resources/configs/cifar10/distributed/node_3.yaml

node_id: "agent-3"
node_index: 3                   # this site's position; sets its RNG seed offset

num_epochs: 30                  # T
seed: 42

neighbors:
  mode: "explicit"
  send_to: ["agent-0", "agent-1", "agent-2", "agent-4"]
  # A peer that cannot accept inbound connections publishes through grpc/run_relay.py;
  # its entry here then names the relay's address instead.
  recv_from:
    - node_id: "agent-0"
      server_uri: "localhost:50051"
    - node_id: "agent-1"
      server_uri: "localhost:50052"
    - node_id: "agent-2"
      server_uri: "localhost:50053"
    - node_id: "agent-4"
      server_uri: "localhost:50055"

algorithm_configs:
  warmup_rounds: 3              # n_initial
  token_budget: 40              # B
  alpha_tau: 0.05
  objective: "maximize"
  emit_insight: false
  total_proposals: null
  n_local_candidates: 50        # n_candidates

  weights:
    beta: 2.0
    lam: 2.0
    gamma: 32.0
    sigma_s: 0.5
    metric: "euclidean"
    kernel: "sigma_sq"
    weight_by_fidelity: true
    peer_normalization: "mixing_weight"

  baseline:
    baseline: "fixed"
    baseline_kwargs:
      threshold: 0.7            # tau
      scale: 0.5                # Y_SCALE

  pruner:
    pruner: "fidelity"
    pruner_kwargs:
      alpha_tau: 0.05

surrogate_configs:
  surrogate_path: "./decentralized/resources/surrogate/matern_gp_surrogate.py"
  surrogate_name: "get_surrogate"
  surrogate_kwargs:
    dim: 7
    alpha: 0.01
    n_restarts: 2

space_configs:
  space_path: "./decentralized/resources/space/cifar10_nas_space.py"
  space_name: "get_design_space"
  space_kwargs:
    agent_index: 3              # selects this site's shard in the evaluator
    num_agents: 5
    seed: ${seed}

evaluator_configs:
  evaluator_path: "./decentralized/resources/evaluator/cifar10_nas.py"
  evaluator_name: "get_evaluator"
  evaluator_kwargs:
    agent_index: ${space_configs.space_kwargs.agent_index}
    num_agents: ${space_configs.space_kwargs.num_agents}
    distribution: "non_iid"
    data_dir: "./datasets/RawData"
    download: true
    n_epochs: 40
    shard_size: 10000
    primary_frac: 0.8
    val_frac: 0.2
    data_seed: ${seed}
    train_seed: ${seed}         # model init, shuffle and dropout of each training run
    device: "auto"
  cost_seconds: 0.0

train_configs:
  logging_output_dirname: "./output"

comm_configs:
  budget_configs:
    bits_per_neighbor_per_round: null
    tokens_per_neighbor_per_round: 1
  grpc_configs:
    server_uri: "localhost:50054"   # or relay_server_uri, never both
    max_message_size: 1048576
    use_ssl: False
