# FedBuff experiment — CIFAR-10, ResNet-18, same settings as S9e but with FedBuff + ResNet-18.
client_configs:
  train_configs:
    trainer: "VanillaTrainer"
    mode: "step"
    num_local_steps: 20
    optim: "SGD"
    optim_args: { lr: 0.01, momentum: 0.9, weight_decay: 0.0001 }
    loss_fn_path: "./resources/loss/celoss.py"
    loss_fn_name: "CELoss"
    do_validation: False
    do_pre_validation: False
    metric_path: "./resources/metric/acc.py"
    metric_name: "accuracy"
    send_gradient: False
    optimize_memory: False
    train_batch_size: 64
    val_batch_size: 64

  model_configs:
    model_path: "./resources/model/resnet.py"
    model_name: "ResNet18"
    model_kwargs: {}

  comm_configs:
    compressor_configs: { enable_compression: False }

server_configs:
  num_clients: 10
  scheduler: "AsyncScheduler"
  scheduler_kwargs: { same_init_model: True }
  aggregator: "FedBuffAggregator"
  aggregator_kwargs:
    client_weights_mode: "equal"
    staleness_fn: "polynomial"
    staleness_fn_kwargs: { a: 0.5 }
    alpha: 0.9
    K: 3
  device: "cpu"
  num_global_epochs: 20
  val_data_configs:
    dataset_path: "./vsim/server_val_cifar.py"
    dataset_name: "get_cifar10_test"
    dataset_kwargs: {}
    batch_size: 512
  simulator:
    backend: "virtual_time"
    seed: 42
    max_concurrency: 4
    staleness_mode: "round"
    eval_every: 10
    time_model: {}
    heterogeneity:
      compute: { distribution: "lognormal", params: { mu: 0.0, sigma: 0.5 } }
      bandwidth: { distribution: "uniform", params: { lo: 150.0, hi: 600.0 } }
