# S7 experiment — GLOBAL model evaluation logging (true convergence curve).
# Heterogeneous (sigma=0.5), 4 clients, K=4, + server val_data_configs + eval_every.
client_configs:
  train_configs:
    trainer: "VanillaTrainer"
    mode: "step"
    num_local_steps: 100
    optim: "Adam"
    optim_args:
      lr: 0.001
    loss_fn_path: "./resources/loss/celoss.py"
    loss_fn_name: "CELoss"
    do_validation: True
    do_pre_validation: True
    metric_path: "./resources/metric/acc.py"
    metric_name: "accuracy"
    use_dp: False
    epsilon: 1
    clip_grad: False
    clip_value: 1
    clip_norm: 1
    send_gradient: True
    train_batch_size: 64
    val_batch_size: 64
    train_data_shuffle: True
    val_data_shuffle: False

  model_configs:
    model_path: "./resources/model/cnn.py"
    model_name: "CNN"
    model_kwargs:
      num_channel: 1
      num_classes: 10
      num_pixel: 28

  comm_configs:
    compressor_configs:
      enable_compression: False
      lossy_compressor: "SZ2Compressor"
      lossless_compressor: "blosc"
      error_bounding_mode: "REL"
      error_bound: 1e-3
      param_cutoff: 1024

server_configs:
  num_clients: 4
  scheduler: "AsyncScheduler"
  scheduler_kwargs:
    same_init_model: True
  aggregator: "FedAsyncAggregator"
  aggregator_kwargs:
    client_weights_mode: "equal"
    staleness_fn: "polynomial"
    staleness_fn_kwargs:
      a: 0.5
    alpha: 0.9
  device: "cpu"
  num_global_epochs: 60
  logging_output_dirname: "./output"
  logging_output_filename: "result"

  # server-side validation set (full MNIST test) for GLOBAL model evaluation
  val_data_configs:
    dataset_path: "./vsim/server_val_mnist.py"
    dataset_name: "get_mnist_test"
    batch_size: 256
    shuffle: False
    num_workers: 0

  simulator:
    backend: "virtual_time"
    seed: 42
    max_concurrency: 4
    staleness_mode: "round"
    eval_every: 4               # evaluate global model every 4 completions
    time_model:
      base_step_time: 0.01
    heterogeneity:
      compute:
        distribution: "lognormal"
        params: { mu: 0.0, sigma: 0.5 }
      bandwidth:
        distribution: "uniform"
        params: { lo: 150.0, hi: 600.0 }
