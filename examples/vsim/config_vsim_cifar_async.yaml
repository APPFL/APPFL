# Standalone validation — CIFAR-10, FedAsync, CNN (S9e experiment plan).
# Client data via --client_config (cifar10/client_1.yaml, get_cifar10), partition via --partition.
client_configs:
  train_configs:
    trainer: "VanillaTrainer"
    mode: "step"
    num_local_steps: 20
    optim: "SGD"
    optim_args: { lr: 0.05, momentum: 0.9, weight_decay: 0.0001 }
    loss_fn_path: "./resources/loss/celoss.py"
    loss_fn_name: "CELoss"
    do_validation: False          # use server-side global eval; faster
    do_pre_validation: False
    metric_path: "./resources/metric/acc.py"
    metric_name: "accuracy"
    send_gradient: False
    optimize_memory: False
    train_batch_size: 64
    val_batch_size: 64

  model_configs:
    model_path: "./resources/model/cnn.py"
    model_name: "CNN"
    model_kwargs: { num_channel: 3, num_classes: 10, num_pixel: 32 }

  comm_configs:
    compressor_configs: { enable_compression: False }

server_configs:
  num_clients: 10
  scheduler: "AsyncScheduler"
  scheduler_kwargs: { same_init_model: True }
  aggregator: "FedAsyncAggregator"
  aggregator_kwargs:
    client_weights_mode: "equal"
    staleness_fn: "polynomial"
    staleness_fn_kwargs: { a: 0.5 }
    alpha: 0.9
  device: "cpu"
  num_global_epochs: 20
  val_data_configs:
    dataset_path: "./vsim/server_val_cifar.py"
    dataset_name: "get_cifar10_test"
    dataset_kwargs: {}
    batch_size: 512
  simulator:
    backend: "virtual_time"
    seed: 42
    max_concurrency: 4
    staleness_mode: "round"
    eval_every: 10
    time_model: {}   # base_step_time omitted -> uses actual measured GPU training time (AFL-Lib style)
    heterogeneity:
      compute: { distribution: "lognormal", params: { mu: 0.0, sigma: 0.5 } }
      bandwidth: { distribution: "uniform", params: { lo: 150.0, hi: 600.0 } }
