# Virtual-time async FL simulator config (v1) — based on configs/mnist/server_fedasync.yaml
# Only addition vs the stock FedAsync server config is the `server_configs.simulator` block.
# Relative paths (./resources/...) resolve from the `examples/` directory, so run from there.
client_configs:
  train_configs:
    # Local trainer
    trainer: "VanillaTrainer"
    mode: "step"
    num_local_steps: 100
    optim: "Adam"
    optim_args:
      lr: 0.001
    # Loss function
    loss_fn_path: "./resources/loss/celoss.py"
    loss_fn_name: "CELoss"
    # Client validation
    do_validation: True
    do_pre_validation: True
    metric_path: "./resources/metric/acc.py"
    metric_name: "accuracy"
    # Differential privacy
    use_dp: False
    epsilon: 1
    clip_grad: False
    clip_value: 1
    clip_norm: 1
    # Data format
    send_gradient: True
    # Data loader
    train_batch_size: 64
    val_batch_size: 64
    train_data_shuffle: True
    val_data_shuffle: False

  model_configs:
    model_path: "./resources/model/cnn.py"
    model_name: "CNN"
    model_kwargs:
      num_channel: 1
      num_classes: 10
      num_pixel: 28

  comm_configs:
    compressor_configs:
      enable_compression: False
      lossy_compressor: "SZ2Compressor"
      lossless_compressor: "blosc"
      error_bounding_mode: "REL"
      error_bound: 1e-3
      param_cutoff: 1024

server_configs:
  num_clients: 2
  scheduler: "AsyncScheduler"
  scheduler_kwargs:
    same_init_model: True
  aggregator: "FedAsyncAggregator"
  aggregator_kwargs:
    client_weights_mode: "equal"
    staleness_fn: "polynomial"
    staleness_fn_kwargs:
      a: 0.5
    alpha: 0.9
  device: "cpu"
  num_global_epochs: 20
  logging_output_dirname: "./output"
  logging_output_filename: "result"

  # ---- virtual-time simulator block (the only new section) ----
  simulator:
    backend: "virtual_time"
    seed: 42
    max_in_flight: 2            # >=2 (1 is round-robin -> no async dynamics)
    base_step_time: null        # null -> trainer's measured compute_second_per_step
    heterogeneity:
      compute:
        distribution: "lognormal"
        params: { mu: 0.0, sigma: 0.5 }
      bandwidth:
        distribution: "uniform"
        params: { lo: 150.0, hi: 600.0 }
